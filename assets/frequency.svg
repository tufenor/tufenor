    <text x="40" y="100" font-size="40" font-weight="600" letter-spacing="-1" fill="#f5f1e7">Frequency</text>
    <text x="40" y="139" font-size="19" fill="#d8ddd2">Fluxos de gestão.</text>
    <text x="40" y="168" font-size="19" fill="#d8ddd2">Uma interface para organizar.</text>
    <text x="40" y="238" font-size="13" letter-spacing="1.4" fill="#b9ce9c">EM DESENVOLVIMENTO</text>
  </g>
