<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Frequency — interfaces para fluxos de gestão</title>
  <desc id="desc">Diagrama conceitual de uma interface de gestão com navegação para painel, alunos e acessos. Não é captura do produto.</desc>
