<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS — interação e automação local</title>
  <desc id="desc">Diagrama conceitual: voz e interface se conectam ao núcleo local, ao computador e aos dispositivos. Projeto em desenvolvimento.</desc>
