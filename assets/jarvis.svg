    <text x="40" y="100" font-size="40" font-weight="600" letter-spacing="-1" fill="#202723">J.A.R.V.I.S.</text>
    <text x="40" y="139" font-size="19" fill="#4c5b50">Interação simples.</text>
    <text x="40" y="168" font-size="19" fill="#4c5b50">Automação sob controle.</text>
    <text x="40" y="238" font-size="13" letter-spacing="1.4" fill="#546d46">EM DESENVOLVIMENTO</text>
  </g>
